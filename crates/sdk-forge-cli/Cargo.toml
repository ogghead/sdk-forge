[package]
name = "sdk-forge-cli"
description = "CLI entry point for SDK Forge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "sdk-forge"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
miette = { workspace = true }
sdk-forge-analyzer = { workspace = true }
sdk-forge-codegen = { workspace = true }
sdk-forge-recorder = { workspace = true }
sdk-forge-session = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
pretty_assertions = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["sdk-forge-analyzer", "sdk-forge-recorder", "tokio"]

[lints]
workspace = true
